services:

  ollama:
    image: ollama/ollama
    volumes:
      - ollama_data:/root/.ollama
    # Uncomment for GPU support:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    entrypoint: ["/bin/bash", "-c"]
    command: >
      "ollama serve &
      until ollama list 2>/dev/null; do sleep 2; done &&
      ollama pull qwen3-embedding &&
      wait"

  neo4j:
    image: neo4j:5.20
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/password
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "password", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    env_file: .env
    environment:
      NEO4J_URI: bolt://neo4j:7687
      OLLAMA_LOCAL_URL: http://ollama:11434/v1
    volumes:
      - ./data:/app/data
    depends_on:
      neo4j:
        condition: service_healthy
      ollama:
        condition: service_healthy
    stdin_open: true
    tty: true

volumes:
  neo4j_data:
  ollama_data:
