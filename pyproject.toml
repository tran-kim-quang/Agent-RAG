[project]
name = "agent-rag"
version = "0.1.0"
description = ""
authors = [
    {name = "meoconlonton",email = "trankimquang1603@gmail.com"}
]
readme = "README.md"
requires-python = "^3.11, <4.0"
dependencies = [
    "huggingface-hub (>=0.34.0,<1.0.0)",
    "transformers (>=4.52.0,<5.0.0)",
    "accelerate (>=1.8.1,<2.0.0)",
    "sentencepiece (>=0.2.0,<0.3.0)",
    "safetensors (>=0.5.3,<0.6.0)",
    "langchain (==0.3.24)",
    "langchain-core (==0.3.56)",
    "langchain-community (==0.3.23)",
    "langgraph (>=0.5.0,<0.6.0)",
    "pandas (>=3.0.3,<4.0.0)",
    "pyarrow (>=24.0.0,<25.0.0)",
    "langchain-experimental (==0.3.4)",
    "langchain-openai (==0.3.1)",
    "neo4j (>=6.2.0,<7.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "fastapi (>=0.116.1,<0.117.0)",
    "uvicorn[standard] (>=0.35.0,<0.36.0)",
    "python-multipart (>=0.0.20,<0.0.21)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "sqlalchemy (>=2.0.41,<3.0.0)",
    "psycopg[binary] (>=3.2.9,<4.0.0)",
    "alembic (>=1.16.2,<2.0.0)",
    "pyjwt (>=2.10.1,<3.0.0)",
    "argon2-cffi (>=25.1.0,<26.0.0)",
    "celery[redis] (>=5.5.3,<6.0.0)",
    "minio (>=7.2.15,<8.0.0)",
    "requests (>=2.32.0,<2.33.0)",
    "pypdf (>=6.14.2,<7.0.0)",
    "arxiv (>=2.2.0,<3.0.0)",
    "wikipedia (>=1.4.0,<2.0.0)",
    "torch (==2.7.1)",
    "torchvision (==0.22.1)",
    "torchaudio (==2.7.1)",
    "langgraph-checkpoint-postgres (>=2.0.25,<3.0.0)"
]

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)"
]

[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
torch = { version = "==2.7.1", source = "pytorch-cu128" }
torchvision = { version = "==0.22.1", source = "pytorch-cu128" }
torchaudio = { version = "==2.7.1", source = "pytorch-cu128" }

[[tool.poetry.source]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
priority = "explicit"


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
